<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Hauspost Scanner</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a73e8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- SETUP SCREEN (shown when CLIENT_ID not configured) -->
  <div id="setup-screen" class="screen" style="display:none">
    <div class="setup-box">
      <div class="setup-icon">⚙️</div>
      <h2>Einrichtung erforderlich</h2>
      <p>Trage deine Google OAuth Client-ID ein, um Google Drive zu nutzen.</p>
      <input type="text" id="client-id-input" placeholder="xxxxx.apps.googleusercontent.com" />
      <button class="btn-primary" onclick="saveClientId()">Speichern & starten</button>
      <a href="SETUP.html" class="setup-link">Wie bekomme ich eine Client-ID?</a>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app-screen" class="screen" style="display:none">

    <header>
      <div class="header-left">
        <span class="app-icon">📬</span>
        <span class="app-title">Hauspost Scanner</span>
      </div>
      <div class="header-right">
        <div id="auth-area">
          <button id="login-btn" class="btn-login" onclick="signIn()">
            <span>🔑</span> Anmelden
          </button>
          <div id="user-badge" style="display:none">
            <span class="user-dot"></span>
            <span id="user-name">Drive verbunden</span>
            <button class="btn-signout" onclick="signOut()" title="Abmelden">✕</button>
          </div>
        </div>
      </div>
    </header>

    <main>

      <!-- Doc type selector -->
      <div class="doc-type-bar">
        <span class="label">Typ:</span>
        <div class="type-chips" id="type-chips">
          <button class="chip active" data-type="Brief">✉️ Brief</button>
          <button class="chip" data-type="Rechnung">🧾 Rechnung</button>
          <button class="chip" data-type="Behoerde">🏛️ Behörde</button>
          <button class="chip" data-type="Paket">📦 Paket</button>
          <button class="chip" data-type="Sonstiges">📄 Sonstiges</button>
        </div>
      </div>

      <!-- Photo grid -->
      <div id="photo-section">
        <div id="empty-state">
          <div class="empty-icon">📷</div>
          <p>Noch keine Fotos</p>
          <p class="hint">Tippe auf den Button unten, um zu starten</p>
        </div>
        <div id="photo-grid"></div>
        <div id="page-count-bar" style="display:none">
          <span id="page-count-text"></span>
        </div>
      </div>

    </main>

    <!-- Bottom action bar -->
    <div class="bottom-bar">
      <input type="file" id="camera-input" accept="image/*" capture="environment" multiple style="display:none" />

      <button class="btn-camera" id="capture-btn" onclick="document.getElementById('camera-input').click()">
        <span class="camera-icon">📸</span>
        <span>Foto aufnehmen</span>
      </button>

      <div id="action-buttons" style="display:none">
        <button class="btn-secondary" onclick="clearAll()">🗑️ Alle löschen</button>
        <button class="btn-upload" id="upload-btn" onclick="uploadToDrive()">
          ☁️ In Google Drive
        </button>
      </div>
    </div>

    <!-- Status Toast -->
    <div id="toast" class="toast" style="display:none"></div>

    <!-- Upload Progress Overlay -->
    <div id="progress-overlay" style="display:none">
      <div class="progress-box">
        <div class="spinner"></div>
        <p id="progress-text">Bitte warten...</p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
